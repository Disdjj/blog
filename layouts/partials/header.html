{{/* 副标题与操作区样式已移入 assets/sass/custom/_components.scss */}}
<header id="header">
  <button type="button" class="header-action header-search" data-search-open
          title="搜索（⌘K / Ctrl+K）" aria-label="搜索（快捷键 Ctrl 或 Cmd 加 K）">
    <svg aria-hidden="true" viewBox="0 0 16 16" width="1.1rem" height="1.1rem" fill="currentColor">
      <path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"></path>
    </svg>
  </button>

  <button id="dark-mode-toggle" class="dark-mode-toggle header-action" type="button" aria-label="切换深浅色主题">
    <svg width="1.2rem" height="1.2rem" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 496 496" aria-hidden="true">
      <path fill="currentColor" d="M8,256C8,393,119,504,256,504S504,393,504,256,393,8,256,8,8,119,8,256ZM256,440V72a184,184,0,0,1,0,368Z" transform="translate(-8 -8)"/>
    </svg>
  </button>

  <h1>
    <a href="{{ .Site.BaseURL }}">{{ .Site.Params.title | default .Site.Title }}</a>
  </h1>

  {{ if .Site.Params.description }}
  <p class="site-description">{{ .Site.Params.description }}</p>
  {{ end }}

  <nav aria-label="主导航">
    {{ range .Site.Menus.main }}
    <span class="nav-bar-item">
      {{ if .Pre }}
        <span class="icon">{{ .Pre | safeHTML }}</span>
      {{ end }}
      <a class="link" href="{{ .URL | safeURL }}">{{ .Name }}</a>
    </span>
    {{ end }}
  </nav>
</header>
<hr class="head-rule">
