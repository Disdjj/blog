{{ define "main" }}
<main id="main" class="search-page">
  <h2 class="page-title">{{ .Title }}</h2>

  {{ with .Content }}<div class="content search-intro">{{ . }}</div>{{ end }}

  <div class="search-page-box">
    <label class="visually-hidden" for="search-page-input">搜索文章</label>
    <svg class="search-page-icon" aria-hidden="true" viewBox="0 0 16 16" width="1rem" height="1rem" fill="currentColor">
      <path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"></path>
    </svg>
    <input
      type="search"
      id="search-page-input"
      class="search-page-input"
      placeholder="搜索标题、标签或正文…"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      role="combobox"
      aria-expanded="true"
      aria-controls="search-page-results"
      aria-autocomplete="list">
  </div>

  <p id="search-page-status" class="search-status" role="status" aria-live="polite"></p>

  <ul id="search-page-results" class="search-results" role="listbox" aria-label="搜索结果"></ul>

  <noscript>
    <p class="search-empty">站内搜索需要启用 JavaScript。你也可以浏览<a href="/archives/">归档</a>或<a href="/tags/">标签</a>。</p>
  </noscript>
</main>
{{ end }}
